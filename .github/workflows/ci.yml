name: Aegis CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Download repository
      uses: actions/checkout@v4
      
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'
        
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r api/requirements.txt
        pip install aiosqlite

    - name: Health Check
      run: |
        docker compose up -d
        timeout 10 bash -c 'while [[ "$(curl -s -o /dev/null -w ''%{http_code}'' localhost:8000/health)" != "200" ]]; do sleep 1; done' || false
        echo "API Healthy"
        
    - name: Run Tests
      env:
        DATABASE_URL: "sqlite+aiosqlite:///:memory:"
        SUPABASE_URL: https://mock.supabase.co
        WEBHOOK_SECRET: mock_whsec
        API_KEY: mock_api_key
        QSTASH_TOKEN: mock_token
        QSTASH_CURRENT_SIGNING_KEY: mock_curr
        QSTASH_NEXT_SIGNING_KEY: mock_next
        PUBLIC_API_URL: https://mock.railway.app
        STRIPE_SECRET_KEY: sk_test_mock
      run: |
        PYTHONPATH=. python -m pytest core/tests/ -v